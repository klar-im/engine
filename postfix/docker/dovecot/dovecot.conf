protocols = imap lmtp

# Logging
log_path = /dev/stderr
info_log_path = /dev/stderr

# Mail location
mail_location = maildir:/var/mail/%d/%n
mail_uid = vmail
mail_gid = vmail
first_valid_uid = 5000

# Auth
auth_mechanisms = plain login
passdb {
  driver = passwd-file
  args = /etc/dovecot/passwd
}
userdb {
  driver = static
  args = uid=vmail gid=vmail home=/var/mail/%d/%n
}

# Listen on all interfaces
listen = *

# Disable SSL for testing
ssl = no
disable_plaintext_auth = no

# LMTP service — Postfix delivers here
service lmtp {
  inet_listener lmtp {
    address = 0.0.0.0
    port = 24
  }
}

# IMAP service
service imap-login {
  inet_listener imap {
    address = 0.0.0.0
    port = 143
  }
}

# LMTP protocol — enable sieve for filing
protocol lmtp {
  mail_plugins = $mail_plugins sieve
}

# IMAP protocol — enable imapsieve for feedback
protocol imap {
  mail_plugins = $mail_plugins imap_sieve
}

# Sieve plugin config
plugin {
  # Global sieve script for LMTP delivery (files spam to Junk)
  sieve_before = /etc/dovecot/sieve/default.sieve

  # imapsieve: trigger scripts on IMAP folder moves
  sieve_plugins = sieve_imapsieve sieve_extprograms

  # When message is moved INTO Junk
  imapsieve_mailbox1_name = Junk
  imapsieve_mailbox1_causes = COPY APPEND
  imapsieve_mailbox1_before = file:/etc/dovecot/sieve/report-spam.sieve

  # When message is moved OUT OF Junk to any other folder
  imapsieve_mailbox2_name = *
  imapsieve_mailbox2_from = Junk
  imapsieve_mailbox2_causes = COPY
  imapsieve_mailbox2_before = file:/etc/dovecot/sieve/report-ham.sieve

  # Directory for pipe executables
  sieve_pipe_bin_dir = /usr/local/bin

  # Allow execute
  sieve_global_extensions = +vnd.dovecot.pipe +vnd.dovecot.execute
}

# Namespace
namespace inbox {
  inbox = yes
  separator = /

  mailbox Junk {
    auto = subscribe
    special_use = \Junk
  }

  mailbox Trash {
    auto = subscribe
    special_use = \Trash
  }

  mailbox Sent {
    auto = subscribe
    special_use = \Sent
  }
}
