# Klar Milter — Example Production Configuration
#
# Copy this file to /etc/klar/klar-milterd.toml (the path packaging/klar-milterd.service
# reads) and adjust for your setup. Behind Stalwart start from stalwart/config/klar-milterd.toml.
# Reload with: kill -HUP $(pidof klar-milterd)

# ---------------------------------------------------------------------------
# Milter
# ---------------------------------------------------------------------------

# libmilter listen address (Postfix connects here)
# Format: inet:PORT@HOST
listen = "inet:8891@127.0.0.1"

# Mode: "tag" adds headers only, "reject" also rejects high-confidence spam
# Start with "tag" until you trust the model, then switch to "reject".
mode = "tag"

# Sensitivity profile: cautious (0.70), standard (0.50), aggressive (0.30)
# This is the spam score threshold above which mail is labeled "spam".
profile = "standard"

# Override the profile threshold with a custom value (0.0 to 1.0).
# Set to -1 to use the profile default.
# spam_threshold_override = -1.0

# In reject mode, bounce only when the content model's CALIBRATED spam side
# (the artifact's own knot mapped onto the 0.99 Standard gate, before any
# structural offset) reaches this AND a structural condemn corroborates it.
# 0.99 is the gate itself. Values above it are reachable only by heads that
# emit raw probabilities near 1.0 on blatant spam; a label-smoothed head such
# as gen3-v6 tops out at 0.9906 on this scale, so 0.995 would never bounce.
reject_threshold = 0.99

# If classification fails (engine crash, timeout), accept the message anyway.
# Set to false to tempfail (4xx) on errors — safer but may delay mail.
fail_open = true

# Engine inference timeout in milliseconds.
timeout_ms = 1500

# Maximum message size to classify (bytes). Larger messages are truncated.
max_message_bytes = 5242880  # 5 MB

# Concurrency limits
max_inflight_sessions = 64
max_inflight_bytes = 536870912  # 512 MB

# ---------------------------------------------------------------------------
# Model
# ---------------------------------------------------------------------------

# Where scripts/fetch_model.sh put the model. The version reported in
# X-Klar-Model-Version comes from model_version_file: the engine's MANIFEST.json
# (its model_uuid), or a plain VERSION file with the version on its first line.
model_dir = "/var/lib/klar/model"
model_version_file = "/var/lib/klar/model/MANIFEST.json"

# Origin-IP reputation: Spamhaus DROP netblocks, checked offline against the
# address the MTA saw connect (no per-message DNS). Build with
# `make model-lab/build-ip-blocklist`. Set empty to disable the signal; a missing or
# malformed file disables it too and never blocks startup.
# DROP moves, so refresh this on a cron — past ip_blocklist_max_age_days the
# daemon reports the list stale (it keeps using it: stale beats absent).
ip_blocklist_path = "/var/lib/klar/model/ip_blocklist.bin"
ip_blocklist_max_age_days = 14

# Relay hops you operate, as CIDRs or bare addresses. Set this ONLY if this milter
# sits behind an MTA you control — it is what licenses reading the origin address
# out of the Received chain instead of the connection.
#
# Why you would need it: behind a relay, xxfi_connect reports the RELAY, so the
# DROP check above is inert. With this set, the daemon walks the Received chain
# past hops in these ranges and checks the first one that is not yours. That hop
# was written by a host you trust; everything below it is attacker-writable and is
# never read. The resulting signal is deliberately weaker than an observed one and
# can never junk a message on its own.
#
# Empty (the default) = the connecting address is the only origin trusted.
# trusted_relay_cidrs = ["10.88.0.0/24"]

# What to make of the message's own Authentication-Results header. The engine
# reads it, it does not verify DKIM/DMARC itself, and a `dkim=pass header.d=<brand>`
# on a From at that brand's domain is a strong ham signal. So:
#   "trust-topmost"  the topmost AR was written by YOUR MTA. Correct behind
#                    Postfix with OpenDKIM/OpenDMARC ahead of this milter in
#                    smtpd_milters (they stamp a trusted AR and strip the client's).
#   "ignore"         this milter sees the client's raw bytes, so any AR on them is
#                    the sender's claim about itself. Stalwart is this case
#                    (see stalwart/README.md): every AR header is dropped before
#                    classification and the verdict rests on everything else.
# Getting this wrong in the trusting direction lets a forged AR buy delivery.
auth_results = "trust-topmost"

# ---------------------------------------------------------------------------
# Health / Metrics
# ---------------------------------------------------------------------------

# HTTP health server for monitoring.
# Endpoints: /livez (liveness), /readyz (readiness), /metrics (Prometheus)
# /metrics is UNAUTHENTICATED — bind loopback (or an internal address) and front
# it with your own auth/firewall. Binding 0.0.0.0/:: is refused unless you also
# set health_allow_public = true (e.g. a firewalled container exposing readiness).
health_enabled = true
health_listen = "127.0.0.1:8892"
# health_allow_public = false

# ---------------------------------------------------------------------------
# Event Store
# ---------------------------------------------------------------------------

# SQLite database for decision audit trail.
event_store_path = "/var/lib/klar/events.sqlite3"

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------

# Log level: debug, info, warn, error
log_level = "info"

# JSON structured logging (recommended for production)
log_json = true

# ---------------------------------------------------------------------------
# Allow/Block Lists
# ---------------------------------------------------------------------------

# Messages from these senders/domains skip classification (always delivered).
# allowlist_senders = ["ceo@example.com"]
# allowlist_domains = ["trusted-partner.com"]

# Messages from these senders/domains are always rejected.
# blocklist_senders = ["known-spammer@evil.com"]
# blocklist_domains = ["spam-domain.com"]
blocklist_action = "reject"

# ---------------------------------------------------------------------------
# Per-Domain Policies (optional)
# ---------------------------------------------------------------------------
# Override mode/profile/thresholds for specific recipient domains.
# Useful for multi-tenant setups.

# [[domain_policy]]
# recipient_domain = "sensitive.example.com"
# mode = "reject"
# profile = "cautious"
# reject_threshold = 0.99
