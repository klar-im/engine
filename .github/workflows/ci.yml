# Klar Engine — open-core CI.
#
# Runs ONLY on GitHub-hosted ubuntu-latest. This repo is public, so a self-hosted
# runner must never execute its jobs: a fork PR could run arbitrary code on the
# host. Two things keep that true — and this file is only one of them:
#   1. This is the single workflow the publish pipeline ships; it pins
#      `runs-on: ubuntu-latest` and uses no secrets.
#   2. The klar-im self-hosted runner lives in an org runner group restricted to
#      private repos with "Allow public repositories" OFF, so even a malicious
#      `runs-on: self-hosted` job added via PR cannot schedule onto it.
# Also set Settings → Actions → "Require approval for all outside collaborators"
# so fork PRs do not auto-run.
name: Engine CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: engine-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# llama.cpp .so libs live here after `make setup`; llama-quantize and the built
# test binaries link against them.
env:
  LD_LIBRARY_PATH: ${{ github.workspace }}/engine/deps/llama-install/lib
  # Deterministic GEMM reductions so boundary-adjacent fixtures don't flip on
  # thread-scheduling noise (mirrors the monorepo milter CI).
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"

jobs:
  build-and-test:
    timeout-minutes: 40
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Cache llama.cpp install
        uses: actions/cache@v5
        with:
          path: engine/deps/llama-install
          key: ${{ runner.os }}-llama-${{ hashFiles('engine/scripts/setup.sh') }}

      - name: Cache the released model
        uses: actions/cache@v5
        with:
          path: engine/model
          # The manifest pins every byte, so it is the whole key.
          key: engine-model-${{ hashFiles('postfix/model/released-manifest.json') }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # gmime/xxhash/json/cmake are installed by `make setup`; postfix also
          # needs libmilter + sqlite.
          sudo apt-get install -y libmilter-dev libsqlite3-dev python3-venv

      - name: Set up C/C++ deps (llama.cpp, cmake configure)
        run: make setup

      # The tests run against the RELEASED bytes, the same artifact klar.im's box
      # and the container fetch: sha256-verified per file, 400 MB, seconds from
      # the cache. `make import` (HF download + GGUF conversion) stays the path for
      # converting your own model; its quantisation is not bit-identical to the
      # release, and boundary-adjacent fixtures flip on that, so it is not what
      # the suite is measured against. The licence acceptance is the CI's, for the
      # test run only: nothing here redistributes the weights.
      - name: Fetch the released model
        run: KLAR_ACCEPT_MODEL_LICENSE=1 postfix/scripts/fetch_model.sh engine/model

      - name: Build engine + reference milter
        run: make build

      - name: Run C ABI tests
        run: make test

  # Stalwart + klar-milterd, end to end (stalwart/scripts/test_e2e.sh): the
  # image built from this tree with no weights, the model fetched into its
  # volume on first start, upstream's Stalwart image beside it, both modes
  # (shadow and final) driven over SMTP and read back over JMAP. Needs docker
  # compose, which ubuntu-latest has, and ~400 MB from Klar's public bucket.
  #
  # The image is built ONCE here, through buildx with the Actions layer cache
  # (the engine compile is the slow layer and rarely changes), then handed to
  # the compose stack prebuilt and saved as an artifact for the release job,
  # which retags what was tested rather than compiling a third time.
  stalwart-e2e:
    timeout-minutes: 40
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - name: Build klar-milterd (cached layers)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: postfix/docker/Dockerfile
          tags: klar-milterd:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Stalwart + klar-milterd end to end
        env:
          KLAR_MILTERD_IMAGE: klar-milterd:ci
        run: bash stalwart/scripts/test_e2e.sh
      - name: Save the tested image for the release job
        if: startsWith(github.ref, 'refs/tags/v')
        run: docker save klar-milterd:ci | gzip > klar-milterd-image.tar.gz
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: klar-milterd-image
          path: klar-milterd-image.tar.gz
          retention-days: 1

  # A tag v* publishes the klar-milterd image the E2E just exercised to ghcr.io
  # (no weights, licence-gated model fetch at first start) and opens a GitHub
  # Release for it. GITHUB_TOKEN is the only credential and only this job may
  # write; the two jobs above stay read-only.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-and-test, stalwart-e2e]
    timeout-minutes: 20
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: klar-milterd-image
      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Push the tested image
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/klar-milterd
          TAG=${GITHUB_REF_NAME}
          docker load < klar-milterd-image.tar.gz
          docker tag klar-milterd:ci "$IMAGE:$TAG"
          docker tag klar-milterd:ci "$IMAGE:latest"
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"
      - name: Prove the pushed image refuses without the licence flag
        run: |
          set +e
          docker run --rm "ghcr.io/${{ github.repository_owner }}/klar-milterd:${GITHUB_REF_NAME}" >/dev/null 2>&1
          [ $? -eq 3 ] || { echo "the image must exit 3 without KLAR_ACCEPT_MODEL_LICENSE"; exit 1; }
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "klar-milterd $GITHUB_REF_NAME" --generate-notes \
            --notes "Container image: \`ghcr.io/${{ github.repository_owner }}/klar-milterd:${GITHUB_REF_NAME}\` (built from this tag, no weights; first start fetches the CC-BY-NC-4.0 model with KLAR_ACCEPT_MODEL_LICENSE=1). Stalwart setup: stalwart/README.md. Postfix setup: postfix/README.md."
