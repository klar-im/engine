# Klar Engine — open-core CI.
#
# Runs ONLY on GitHub-hosted ubuntu-latest. This repo is public, so a self-hosted
# runner must never execute its jobs: a fork PR could run arbitrary code on the
# host. Two things keep that true — and this file is only one of them:
#   1. This is the single workflow the publish pipeline ships; it pins
#      `runs-on: ubuntu-latest` and uses no secrets.
#   2. The klar-im self-hosted runner lives in an org runner group restricted to
#      private repos with "Allow public repositories" OFF, so even a malicious
#      `runs-on: self-hosted` job added via PR cannot schedule onto it.
# Also set Settings → Actions → "Require approval for all outside collaborators"
# so fork PRs do not auto-run.
name: Engine CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: engine-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# llama.cpp .so libs live here after `make setup`; llama-quantize and the built
# test binaries link against them.
env:
  LD_LIBRARY_PATH: ${{ github.workspace }}/engine/deps/llama-install/lib
  # Keep in sync with engine/scripts/setup.sh (LLAMA_PIN).
  LLAMA_PIN: b8660
  # Deterministic GEMM reductions so boundary-adjacent fixtures don't flip on
  # thread-scheduling noise (mirrors the monorepo milter CI).
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"

jobs:
  build-and-test:
    timeout-minutes: 40
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Cache llama.cpp install
        uses: actions/cache@v5
        with:
          path: engine/deps/llama-install
          key: ${{ runner.os }}-llama-${{ hashFiles('engine/scripts/setup.sh') }}

      - name: Cache converted model
        uses: actions/cache@v5
        with:
          path: engine/model
          # Bust when the conversion path changes (Makefile/converter/deps).
          key: engine-model-${{ env.LLAMA_PIN }}-${{ hashFiles('Makefile', 'engine/export_classifier_weights.py', 'engine/requirements-demo.txt') }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # gmime/xxhash/json/cmake are installed by `make setup`; postfix also
          # needs libmilter + sqlite.
          sudo apt-get install -y libmilter-dev libsqlite3-dev python3-venv

      - name: Set up C/C++ deps (llama.cpp, cmake configure)
        run: make setup

      - name: Install GGUF tooling (Linux only, not provided by setup.sh)
        run: |
          # llama-quantize binary from the pinned prebuilt release.
          curl -sL "https://github.com/ggml-org/llama.cpp/releases/download/${LLAMA_PIN}/llama-${LLAMA_PIN}-bin-ubuntu-x64.tar.gz" \
            | tar -xz -C /tmp --wildcards '*llama-quantize'
          sudo install -m 0755 "$(find /tmp -type f -name llama-quantize | head -1)" /usr/local/bin/llama-quantize
          # convert_hf_to_gguf.py from the matching source tag (imports the pip
          # `gguf` module installed by `make import` / requirements-demo.txt).
          sudo curl -sL "https://raw.githubusercontent.com/ggml-org/llama.cpp/${LLAMA_PIN}/convert_hf_to_gguf.py" \
            -o /usr/local/bin/convert_hf_to_gguf.py
          sudo chmod 0755 /usr/local/bin/convert_hf_to_gguf.py

      - name: Import the public production model
        run: |
          python3 -m venv .venv
          # Skips cleanly if the model cache already populated engine/model.
          if [ ! -f engine/model/gguf/encoder-q4_k_m.gguf ]; then
            make import PYTHON="$PWD/.venv/bin/python"
          else
            echo "[ci] model restored from cache; skipping import"
          fi

      - name: Build engine + reference milter
        run: make build

      - name: Run C ABI tests
        run: make test
